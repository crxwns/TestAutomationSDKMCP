name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --python 3.12

      - name: Check package version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_version.py "$RELEASE_TAG"

      - name: Validate release installation
        run: uv run pytest -m release

      - name: Build package
        run: uv build --out-dir dist

      - name: Generate third-party license file
        run: uv run --with pip-licenses pip-licenses --format=plain-vertical --with-license-file --no-license-path --output-file THIRD_PARTY_LICENSES.txt

      - name: Create release zip
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/create_release_archive.py --tag "$RELEASE_TAG" --dist dist --license-file THIRD_PARTY_LICENSES.txt

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz *.zip | sort > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
